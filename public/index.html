<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cyber Blog - SAE DevOps</title>
    <meta name="theme-color" content="#0b0f14">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS personnalisé -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- defer : exécution après parsing HTML, sans bloquer le rendu -->
    <script src="js/include.js" defer></script>
    <script src="js/router.js" defer></script>
    <script src="js/theme.js" defer></script>
    <script src="js/animations.js" defer></script>
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://i.ytimg.com">
    <link rel="preconnect" href="https://www.google.com">
    <!-- Bootstrap JS (nécessaire pour menu dropdown) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  </head>
  <body>
    <!-- MENU injecté dynamiquement -->
    <div id="menu"></div>
    <!-- CONTENU dynamique -->
    <main class="container">
      <div id="content"></div>
    </main>
    <!-- FOOTER injecté dynamiquement -->
    <div id="footer"></div>
  </body>
</html>
